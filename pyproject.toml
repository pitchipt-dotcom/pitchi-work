[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchi-work"
version = "0.1.0"
readme = "README.md"
license-files = ["LICENSE", "LICENSE_SCOPE.md", "LICENSING.md", "THIRD_PARTY_NOTICES.md"]
description = "Host-owned finite workflows, validation and local AI CLI"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13"]

[project.optional-dependencies]
cloud = ["openai>=2,<3", "anthropic>=0.75,<1"]

[project.scripts]
pitchi-work = "pitchi_work.cli:main"
ptot-guidelines = "ptotsearch_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pitchi_work = ["web_probe.mjs", "search_probe.php", "stable_procedures/*.json"]
ptotsearch_tools = ["search-support.patch", "api_probe.php", "public_probe.mjs"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
